name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reminder behavior
        shell: powershell
        run: |
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File .\reminder.ps1 -Check
          if ($LASTEXITCODE -ne 0) { throw 'Reminder checks failed.' }
