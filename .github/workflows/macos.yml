name: macOS build
on:
  push:
    paths: ['macos/**', '.github/workflows/macos.yml', 'verses.json', 'mushaf-lines.json', 'background.png', 'version.txt', 'AmiriQuran.ttf', 'Amiri-OFL.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and check reading behavior
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: QuranReminder-macOS
          path: build/QuranReminder-macOS.zip
  verify-intel:
    needs: build
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuranReminder-macOS
          path: mac-build-download
      - name: Verify packaged app on Intel macOS
        run: |
          ditto -x -k mac-build-download/QuranReminder-macOS.zip .
          codesign --verify --deep --strict --verbose=2 "Quran Reminder.app"
          "Quran Reminder.app/Contents/MacOS/QuranReminder" --check
          "Quran Reminder.app/Contents/MacOS/QuranReminder" --ui-check
